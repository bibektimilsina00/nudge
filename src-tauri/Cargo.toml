[package]
name = "nudge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
default-run = "nudge"

[[bin]]
name = "nudge"
path = "src/main.rs"

# Accuracy harness. Shares the lib so it exercises the real coordinate math.
[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[lib]
name = "nudge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
cpal = "0.17.3"
dirs = "7.0.0"
hound = "3.5.1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time"] }
toml = "1.0.7"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSView", "NSResponder", "NSColor", "NSScreen", "NSApplication", "NSGraphics", "NSMenu", "NSImage"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = "0.3.2"
