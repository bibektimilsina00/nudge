[package]
name = "nudge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
default-run = "nudge"

[[bin]]
name = "nudge"
path = "src/main.rs"

# Accuracy harness. Shares the lib so it exercises the real coordinate math.
# The reviewer's eval. See src/bin/judge.rs.
[[bin]]
name = "judge"
path = "src/bin/judge.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[example]]
name = "handback"
path = "examples/handback.rs"

[[example]]
name = "tap"
path = "examples/tap.rs"

[[example]]
name = "portable"
path = "examples/portable.rs"

[[example]]
name = "jpegtime"
path = "examples/jpegtime.rs"

[[example]]
name = "ear"
path = "examples/ear.rs"

[[example]]
name = "sck"
path = "examples/sck.rs"

[[example]]
name = "captime"
path = "examples/captime.rs"

[[bin]]
name = "ax"
path = "src/bin/ax.rs"

[[bin]]
name = "truth"
path = "src/bin/truth.rs"

[[bin]]
name = "picks"
path = "src/bin/picks.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[lib]
name = "nudge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Compile the cross-platform implementations even on macOS, so they can be built
# and run on the machine doing the porting. Without this the `elsewhere/` code is
# never compiled here, and code that is never compiled is code that does not work.
portable = []

[dependencies]
active-win-pos-rs = "0.11.0"
async-trait = "0.1.92"
base64 = "0.23.1"
cpal = "0.17.3"
device_query = "4.0.1"
dirs = "7.0.0"
dom_smoothie = "0.18.1"
enigo = "0.3.0"
hound = "3.5.1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
objc2-pdf-kit = { version = "0.3.2", features = ["PDFDocument"] }
open = "5.4.4"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-updater = "2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time", "process", "io-util", "sync", "rt"] }
toml = "1.0.7"
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
libc = "0.2.189"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSView", "NSResponder", "NSColor", "NSScreen", "NSApplication", "NSGraphics", "NSMenu", "NSImage"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-image-io = { version = "0.3.2", features = ["CGImageDestination"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCShareableContent", "SCScreenshotManager", "SCStream", "SCError"] }
objc2-speech = { version = "0.3.2", features = ["SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription", "SFErrors"] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25.1"

[dev-dependencies]
minisign-verify = "0.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
