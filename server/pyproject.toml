[project]
name = "nudge-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests import `app.*`, and this package is the project rather than an installed
# library. Without it pytest runs from a directory that is not on the path.
pythonpath = ["."]
testpaths = ["tests"]
