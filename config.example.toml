# Copy to ~/.config/nudge/config.toml. Every field is optional.

# "ollama" (local, free, offline) | "gemini" (free tier) | "anthropic"
provider = "ollama"

# Omit to use the provider's default.
# model = "qwen3-vl:4b"   # gemini default: gemini-3.5-flash-lite

# Prefer the env var (ANTHROPIC_API_KEY / GEMINI_API_KEY) -- it wins over this.
# api_key = ""

hotkey = "cmd+shift+space"

# Long edge of the screenshot sent to the model -- the main speed dial.
# Measured on a 3024x1964 display: 1920px cost 3.6s a step, 1280px cost 2.4s, and
# both landed dead centre on a 20px icon. Raise it only if small widgets get missed.
# Anthropic silently downscales anything over 2576px, desyncing every coordinate.
max_edge = 1280

# Read each nudge aloud.
speak = true
# "system" is macOS `say`: free, offline, instant, and the default -- speech happens
# on every step, so it should not cost money by default. "gemini" sounds far better
# and is one menu-bar click away ("Natural voice"). It is also the automatic
# fallback target whenever Gemini is unreachable.
#
# macOS ships only 1990s "compact" voices, and the modern Siri voices offered in
# Manage Voices are deliberately unavailable to `say` and to every third-party app.
# For a good offline voice, install a *non-Siri* Premium English voice (Ava,
# Allison, Zoe, Evan, Nathan, Joelle, Tom) -- those do work with "system".
speech_engine = "system"
speech_model = "gemini-2.5-flash-preview-tts"
# Gemini prebuilt voice ("Kore", "Puck", "Aoede", "Charon"...) or a macOS voice name.
# speech_voice = "Kore"

# Model that turns speech into text. Independent of `model` above.
voice_model = "gemini-3.8-flash"

# Click the control instead of only pointing at it. Needs Accessibility permission.
# Toggleable at runtime from the menu bar ("Click for me").
auto_click = false

# Refuse to screenshot password managers and windows whose title names a secret
# (.env, id_rsa, "password", ...). On by default -- the cost of being wrong is not
# symmetric. Extend rather than replace the built-in lists.
privacy_guard = true
blocked_apps = []
blocked_titles = []

# Where Nudge runs commands and writes files. Nothing outside it is touched.
# A folder for work it produces -- not a source repository, or generated pages
# end up among your tracked files.
workspace = "~/Nudge"

# How hard the model thinks before answering: "minimal" | "low" | "medium" | "high".
#
# Thinking tokens bill at the OUTPUT rate, which is five times the input rate, so
# this line costs more than the choice of model does. Measured on 3.6-flash with a
# 1280px screenshot, two calls each:
#
#   minimal   0 thinking tokens    $0.00102 a call
#   low       0 thinking tokens    $0.00103 a call
#   medium    446-2,079            $0.0027-$0.0088 a call
#   high      818-930              $0.0041 a call
#
# Medium is not only dearer, it is erratic -- 446 tokens one call and 2,079 the
# next, for the same request. Low emits none at all.
#
# It costs accuracy: the bench had low at 51% hits against medium's 58%. Those
# numbers predate the accessibility tree, which resolves many controls by name
# without the model looking at pixels at all, so they are due a re-run.
think = "low"

# Have a second pass try to refute an answer before it is given.
#
# Off, and staying off for now. Measured on one full trace: answering took two
# model calls carrying 428 characters of search results; checking took four more
# carrying 7,059, because every checker turn re-sends the whole prompt plus
# everything found so far. Three times the calls and worse in tokens, to buy
# accuracy nobody is currently relying on.
#
# `cargo run --bin truth -- --verify` turns it on for a scoring run. Nothing else
# does.
verify = false

# What Nudge may do beyond its defaults. Nothing, by default.
#
# Three limits sit between the model and your machine: the shell runs only
# commands that read, files are written only inside the workspace, and the web is
# fetched with GET. None of them is arbitrary -- the shell is read-only because a
# model reached for `rm` to get around a refusal, and files are workspace-bound
# because the first thing that ever wrote a file put it in a git repository's
# root. They are scars.
#
# Each name here lifts one, on purpose:
#
#   "shell"  run any command, including ones that change things
#   "files"  write outside the workspace, using absolute paths
#   "http"   send requests with any method, not only ones that read
#
# The menu bar shows what is granted with a tick beside it, and can grant or take
# back either one while Nudge runs. Nothing is written back here, so a restart
# returns to whatever this line says.
#
# Two things stay refused however wide the grant: anything that looks like a
# secret (`.ssh`, `.env`, keychains), and an empty command. Granting a shell is a
# decision about capability, not a decision to hand over your keys.
#
# "http" gates the methods that act. An authenticated GET against an API is
# reading and never needed granting. What never changes is where a request may
# go: nothing on this machine or this network, whatever is granted, and every
# redirect is checked by the same rule as the first hop.
reach = []

# Servers speaking the Model Context Protocol. None by default.
#
# This is how Nudge reaches things that are not on your screen -- your email,
# your calendar, your issues, your notes. Each server is a few lines here and
# brings its own tools; there is no panel and nothing to click, because these
# shapes belong to whoever wrote the server.
#
# Started in the background at launch, so a server that takes a minute to fetch
# itself does not hold up the hotkey. One that fails to start is reported and
# skipped -- its tools are simply absent, and nothing else stops working.
#
# Listing a server here is the grant. The menu bar has a "Tools" submenu showing
# each one with how many tools it brought, and clicking switches it off -- which
# removes its tools from the prompt entirely, rather than letting the model keep
# reaching for something that will be refused.
#
# Tokens go in `env`, beside the server that needs them. Nudge has no business
# holding somebody else's credentials.
#
# [[mcp]]
# name = "files"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/me/Notes"]
#
# [[mcp]]
# name = "github"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "keychain:nudge-github" }
#
# A value of `keychain:name` is looked up in the macOS Keychain rather than used,
# so this file can be copied between machines, opened in an editor and pasted into
# a bug report without carrying your token with it. Store one with:
#
#   security add-generic-password -s nudge-github -a nudge -w ghp_xxx
#
# A plain token still works. Nudge only ever reads the Keychain -- storing a
# credential is a decision to make at a shell prompt you typed, not inside a turn
# you spoke.
