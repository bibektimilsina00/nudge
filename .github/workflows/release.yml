# Build something other people can open, without it depending on one laptop.
#
# The certificate and the notarisation credentials live in GitHub secrets rather
# than on a machine, so a release is a tag rather than a person being available.
# Everything here mirrors scripts/release.sh, which is what to run locally.
name: Release

on:
  push:
    tags: ["v*"]
  # So the pipeline can be proven before a tag is cut, which matters because a
  # signing pipeline that has only ever run once has never really run.
  workflow_dispatch:

jobs:
  macos:
    # Apple silicon. An x86_64 build needs its own runner and its own signing
    # pass -- there is no universal binary here yet, and pretending otherwise
    # ships an app that will not start on half the Macs it reaches.
    runs-on: macos-14

    # The last step writes a GitHub release, and the default token cannot.
    #
    # Without this the whole pipeline runs -- build, sign, notarise, staple,
    # upload, publish -- and then falls over on the final step with "Resource
    # not accessible by integration", which reads like a missing secret and is
    # not one: it is a read-only token being asked to create a release.
    #
    # `contents: write` and nothing else. Naming any permission drops the rest
    # to none, so this narrows the token rather than widening it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # pnpm, because that is what the lockfile in ui/ is. Installed before
      # setup-node so the cache it sets up is the right one.
      # Version comes from package.json's `packageManager`, so CI, Docker and a
      # laptop cannot disagree about it.
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install the interface
        run: cd ui && pnpm install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      # Before the build, not thirty minutes into it. Without this the first
      # sign of a missing secret is `SecKeychainItemImport: Unknown format` from
      # `security import` being handed an empty file, which names neither the
      # secret nor the step that wanted it.
      - name: Check the signing secrets are actually set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Not set: ${missing[*]}"
            echo "A release needs a Developer ID Application certificate. See RELEASING.md."
            exit 1
          fi
          echo "All six are set."

      - name: Check it still works before signing it
        run: cd src-tauri && cargo test

      # A throwaway keychain, unlocked for this job only. Importing into the
      # default login keychain on a shared runner would leave the certificate
      # sitting there for whatever runs next.
      - name: Load the signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo -n "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops to ask for the keychain password and the
          # job hangs until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarise, staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Nothing to do with Apple. This is minisign, over the .app.tar.gz, and
          # it is what a running copy checks before letting a download replace
          # it -- the one signature Apple's notarisation does not cover.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg

      # Straight onto the download page, which is the only place anybody gets
      # this. A release that exists on GitHub and not on the site is a release
      # nobody can download.
      - name: Publish to the download API
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/ssh
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Ship it
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Through the environment, never interpolated into the script.
          # `${{ ... }}` is substituted before bash sees the line, so a commit
          # message carrying a quote and a semicolon would run on the deploy box
          # as us. This is the standard Actions injection and this is the
          # standard fix: untrusted text only ever arrives as a variable.
          NOTES: ${{ github.event.head_commit.message }}
          HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          # The updater's half. Named `.app.tar.gz` by the bundler, with its
          # minisign signature beside it. Missing means the build did not
          # produce them, and shipping a download with no update path is how a
          # first cohort gets stranded -- so it is an error, not a warning.
          tgz=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz | head -1)
          sig=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz.sig | head -1)

          # First line only: a release note is a sentence, and a commit body
          # would arrive as a wall of text under a download button.
          notes=$(printf '%s' "$NOTES" | head -1)

          scp "$dmg" "$HOST:/tmp/Nudge.dmg"
          scp "$tgz" "$HOST:/tmp/Nudge.app.tar.gz"

          # `ssh host VAR=x 'script'` looks like it passes an environment and
          # does not: the remote shell expands $VAR in the very command that
          # assigns it, so it arrives empty. Checked, and it published a blank
          # version. `env` on the remote side is the form that works, and the
          # values are shell-quoted on the way so a note with an apostrophe in it
          # cannot end the string.
          ssh "$HOST" "env \
            NUDGE_VERSION=$(printf %q "$version") \
            NUDGE_NOTES=$(printf %q "$notes") \
            NUDGE_SIG=$(printf %q "$(cat "$sig")") \
            bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/nudge
          docker cp /tmp/Nudge.dmg nudge-api-1:/tmp/Nudge.dmg
          docker cp /tmp/Nudge.app.tar.gz nudge-api-1:/tmp/Nudge.app.tar.gz
          docker compose exec -T api uv run publish.py /tmp/Nudge.dmg \
            --version "$NUDGE_VERSION" --platform macos-arm64 --notes "$NUDGE_NOTES" \
            --update /tmp/Nudge.app.tar.gz --signature "$NUDGE_SIG"
          rm -f /tmp/Nudge.dmg /tmp/Nudge.app.tar.gz
          REMOTE

          # The page has to agree it happened, or this did not ship.
          curl -fsS https://nudge.runmycrew.com/api/releases/macos-arm64 \
            | grep -q "\"version\":\"$version\"" \
            || { echo "published, but the API reports a different version" >&2; exit 1; }
          echo "live: $version"

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/dmg/*.dmg
