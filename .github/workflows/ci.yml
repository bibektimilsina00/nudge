# What has to be true before anything deploys.
#
# Path-filtered, because this repository holds three unrelated things: a macOS
# app in Rust, a Python API, and a Next site. Running all three suites on a typo
# in a heading trains people to ignore a red tick.
name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:

# A second push while the first is still building makes the first irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Against the previous commit on this same branch, not against the
          # repository default branch -- which is what this action does if you
          # do not say. Every push to `alpha` was comparing against `main`, and
          # `main` has no server/ or web/ at all, so every path read as changed
          # and every push redeployed everything. The filter was doing its job
          # perfectly against the wrong question.
          base: ${{ github.ref }}
          filters: |
            app:
              - 'src-tauri/**'
              - 'ui/**'
              - 'Makefile'
              # The build's own configuration. Left out, a change to the list of
              # libraries a Linux build needs skipped the job that would have
              # found it wrong -- which is what happened: a green tick on a
              # commit whose only purpose was fixing that job.
              - '.github/workflows/ci.yml'
              - '.github/actions/linux-deps/**'
            server:
              - 'server/**'
            web:
              - 'web/**'

  app:
    needs: changed
    if: needs.changed.outputs.app == 'true'
    # The Rust tests are platform-agnostic, but this crate's macOS paths are
    # compiled on macOS and a Linux runner would not build them at all.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: cd src-tauri && cargo fmt --check
      # `appkit` is the macOS-only diagnostics in examples/. They are not built
      # by default any more -- a Linux build cannot -- so this is what keeps them
      # compiling on the platform where they are run.
      - run: cd src-tauri && cargo clippy --all-targets --features appkit -- -D warnings
      - run: cd src-tauri && cargo test

  # The same crate, built the way somebody on Linux gets it.
  #
  # Nothing here is a second opinion about the logic: the tests are the same
  # tests. It is about the half of the code that macOS never compiles -- the
  # portable input path, the xcap capture, the Secret Service, and the stubs
  # standing in for AppKit. Those rot silently otherwise, which is exactly how
  # they were found rotted the first time.
  linux:
    needs: changed
    if: needs.changed.outputs.app == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-linux-${{ hashFiles('src-tauri/Cargo.lock') }}
      - uses: ./.github/actions/linux-deps
      - run: cd src-tauri && cargo clippy --all-targets -- -D warnings
      - run: cd src-tauri && cargo test

  server:
    needs: changed
    if: needs.changed.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: cd server && uv sync --frozen
      - run: cd server && uv run pytest -q

  web:
    needs: changed
    if: needs.changed.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json's `packageManager`, so CI, Docker and a
      # laptop cannot disagree about it.
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm lint
      - run: cd web && npx tsc --noEmit
      # The build is the real test here: a broken favicon or a bad import only
      # shows up at build time, and finding that on the deploy box means the box
      # is serving a stale container while somebody works out why.
      - run: cd web && pnpm build
